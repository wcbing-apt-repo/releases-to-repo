name: Update Packages

on:
  schedule:
    - cron: "40 2,6,10,22 * * *" # 6,10,14,18 40 运行一次
  workflow_dispatch: # 允许手动触发

jobs:
  update-packages:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: write

    steps:
      - name: Set up Python Requests
        run: |
          if ! python3 -c "import requests" >/dev/null 2>&1; then
            echo "Python requests is not installed. Installing..."
            pip3 install requests
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for package updates
        # 将脚本 print（stdout）写入 release_notes 文件，以便作为 release 的正文。
        # 脚本中的 logging (stderr) 将不会被重定向，仍会打印到 job 日志。
        run: ./get-git-releases.py > release_notes

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain packages/) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add packages/ data/
          git commit -m "[CI] Update packages"
          git push

      - name: Trigger release workflow
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref "$GITHUB_REF_NAME" \
            --field release_notes="$(cat release_notes)"
